<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes crédits</title>
<meta name="theme-color" content="#1f9d55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crédits">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: une colonne étroite, une ligne par crédit, barre verte pleine largeur */
:root{
  --bg:#f5f7f5; --surface:#ffffff; --fg:#17201a; --muted:#66746b; --line:#dde4df;
  --track:#e3ebe5; --green:#1f9d55; --green-soft:#d6f0df; --danger:#c2412d;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101512; --surface:#171e19; --fg:#e8efe9; --muted:#8d9a91; --line:#26302a;
  --track:#232d26; --green:#34c473; --green-soft:#183324; --danger:#ef7a66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#171e19; --fg:#e8efe9; --muted:#8d9a91; --line:#26302a;
  --track:#232d26; --green:#34c473; --green-soft:#183324; --danger:#ef7a66; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;padding:0 16px}
.wrap{max-width:560px;margin:0 auto;padding-block:32px 48px;display:grid;gap:20px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-size:1.5rem;font-weight:800;margin:0;letter-spacing:-.02em}
.sum{color:var(--muted);font-size:.85rem;margin-top:4px}
.sum b{color:var(--fg);font-family:var(--mono);font-weight:500}
.add{width:44px;height:44px;border-radius:50%;border:none;background:var(--green);color:#fff;
  font-size:1.6rem;line-height:1;cursor:pointer;display:grid;place-items:center;flex:none}
.add:hover{filter:brightness(1.08)}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.list{display:grid;gap:12px}
.loan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pct{font-family:var(--mono);color:var(--green);font-size:.95rem}
.bar{height:12px;background:var(--track);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--green);border-radius:99px;transition:width .5s ease}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meta div{display:grid;gap:2px;min-width:0}
.meta span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meta strong{font-family:var(--mono);font-weight:500;font-size:.9rem;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;
  font:inherit;font-size:.8rem;cursor:pointer}
.ghost:hover{border-color:var(--green)}
.ghost.del{color:var(--danger)}
.done{background:var(--green-soft);color:var(--green);font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px}
.empty{text-align:center;color:var(--muted);padding:32px 0}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row,.meta{grid-template-columns:1fr 1fr}}
label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.formbtns{display:flex;gap:8px;justify-content:flex-end}
.primary{background:var(--green);color:#fff;border:none;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.err{color:var(--danger);font-size:.8rem;margin:0}
.note{font-size:.75rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.fill,.chev svg{transition:none}}
/* Totaux empilés */
.totals{display:grid;gap:6px;margin-top:10px}
.totals div{display:flex;align-items:baseline;gap:10px}
.totals span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:72px;flex:none}
.totals b{font-family:var(--mono);font-weight:500;font-size:1.05rem;font-variant-numeric:tabular-nums}
.totals .big b{font-size:1.25rem;color:var(--fg)}
/* Flèche repli */
.right{display:flex;align-items:center;gap:6px;flex:none}
.chev{width:32px;height:32px;border:none;background:none;color:var(--muted);border-radius:8px;cursor:pointer;display:grid;place-items:center;padding:0}
.chev:hover{background:var(--track);color:var(--fg)}
.chev svg{transition:transform .2s ease}
.loan.closed .chev svg{transform:rotate(-90deg)}
.details{display:grid;gap:10px}
.hint{font-size:.75rem;color:var(--muted);margin:0}
.next{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.next b{color:var(--fg);font-weight:600}
.auto{font-size:.7rem;font-weight:600;color:var(--green);background:var(--green-soft);padding:2px 8px;border-radius:99px}
.top{align-items:center}
/* Mobile : cibles tactiles confortables, pas de zoom iOS sur les champs */
input{font-size:16px;min-height:44px}
.ghost{min-height:38px;padding:8px 12px}
.primary{min-height:44px}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (max-width:480px){
  .wrap{padding-block:20px 40px}
  .bar{height:14px}
  .actions .ghost{flex:1 1 auto}
  .months{width:100%;text-align:right}
  .formbtns button{flex:1}
}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Mes crédits</h1>
      <div class="sum" id="sum"></div>
    </div>
    <button class="add" id="addBtn" aria-label="Ajouter un crédit" title="Ajouter un crédit">+</button>
  </header>

  <form id="form" hidden>
    <label>Nom du crédit<input id="f-name" required placeholder="Ex. Prêt auto"></label>
    <div class="row">
      <label>Montant total (€)<input id="f-total" type="number" inputmode="decimal" min="0" step="0.01" required></label>
      <label>Mensualité (€)<input id="f-monthly" type="number" inputmode="decimal" min="0" step="0.01" required></label>
    </div>
    <div class="row">
      <label>Restant à payer (€)<input id="f-left" type="number" inputmode="decimal" min="0" step="0.01" required></label>
      <label>Jour du prélèvement<input id="f-day" type="number" inputmode="numeric" min="1" max="31" step="1" placeholder="Ex. 5"></label>
    </div>
    <p class="hint">Avec un jour de prélèvement, la mensualité est déduite automatiquement chaque mois à cette date.</p>
    <p class="err" id="err" hidden></p>
    <div class="formbtns">
      <button type="button" class="ghost" id="cancel">Annuler</button>
      <button type="submit" class="primary" id="save">Ajouter</button>
    </div>
  </form>

  <div class="list" id="list"></div>
  <p class="note">Les données restent sur cet appareil.</p>
</div>

<script>
const KEY='credits-v2';
const eur=n=>n.toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2});
let loans; try{loans=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(loans)) loans=[];
try{localStorage.removeItem('credits-v1')}catch(e){}
let editId=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(loans))}catch(e){}};
const $=id=>document.getElementById(id);

/* --- Dates de prélèvement --- */
const pad=n=>String(n).padStart(2,'0');
const isoDay=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDay=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
// Date du prélèvement d'un mois donné (le 31 devient le 30 ou le 28 selon le mois)
const dueIn=(y,m,day)=>new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()));
// Nombre de prélèvements passés entre la dernière vérification (exclue) et aujourd'hui (inclus)
function dueCount(fromISO,day){
  const from=parseDay(fromISO), to=today(); let n=0;
  const start=from.getFullYear()*12+from.getMonth(), end=to.getFullYear()*12+to.getMonth();
  for(let k=start;k<=end;k++){
    const d=dueIn(Math.floor(k/12),k%12,day); if(d>from&&d<=to) n++;
  }
  return n;
}
function nextDue(day){
  const t=today(); let d=dueIn(t.getFullYear(),t.getMonth(),day);
  if(d<=t) d=dueIn(t.getFullYear(),t.getMonth()+1,day);
  return d;
}
const fmtDate=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
// Applique les mensualités échues depuis la dernière ouverture
function sync(){
  let changed=false; const t=isoDay(today());
  loans.forEach(l=>{
    if(!l.day) return;
    if(!l.lastCheck){l.lastCheck=t;changed=true;return}
    if(l.lastCheck===t) return;
    const n=dueCount(l.lastCheck,l.day);
    if(n>0&&l.left>0){l.left=Math.max(0,+(l.left-n*l.monthly).toFixed(2))}
    l.lastCheck=t; changed=true;
  });
  if(changed){save();render()}
}

function render(){
  const list=$('list'); list.innerHTML='';
  if(!loans.length){list.innerHTML='<div class="empty">Aucun crédit. Appuie sur + pour en ajouter un.</div>'}
  let tLeft=0,tMonthly=0;
  loans.forEach(l=>{
    const paid=Math.max(0,l.total-l.left);
    const pct=l.total>0?Math.min(100,paid/l.total*100):0;
    const months=l.monthly>0?Math.ceil(l.left/l.monthly):0;
    if(l.left>0){tLeft+=l.left;tMonthly+=l.monthly}
    const el=document.createElement('div'); el.className='loan'+(l.closed?' closed':'');
    el.innerHTML=`
      <div class="top"><span class="name"></span>
        <span class="right">
          ${l.left<=0?'<span class="done">Remboursé</span>':`<span class="pct">${pct.toFixed(0)} %</span>`}
          <button class="chev" data-toggle="${l.id}" aria-expanded="${!l.closed}" aria-label="${l.closed?'Afficher':'Masquer'} les détails">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct.toFixed(0)}">
        <div class="fill" style="width:${pct}%"></div></div>
      <div class="details"${l.closed?' hidden':''}>
      <div class="meta">
        <div><span>Total</span><strong>${eur(l.total)}</strong></div>
        <div><span>Mensualité</span><strong>${eur(l.monthly)}</strong></div>
        <div><span>Restant</span><strong>${eur(Math.max(0,l.left))}</strong></div>
      </div>
      ${l.day&&l.left>0?`<div class="next"><span>Prochain prélèvement : <b>${fmtDate(nextDue(l.day))}</b></span><span class="auto">Auto chaque mois</span></div>`:''}
      <div class="actions">
        ${l.left>0&&!l.day?`<button class="ghost" data-pay="${l.id}">Payer une mensualité</button>`:''}
        <button class="ghost" data-edit="${l.id}">Modifier</button>
        <button class="ghost del" data-del="${l.id}">Supprimer</button>
        ${months?`<span class="sum months" style="margin:auto 0 auto auto">≈ ${months} mois restants</span>`:''}
      </div></div>`;
    el.querySelector('.name').textContent=l.name;
    list.appendChild(el);
  });
  $('sum').innerHTML=loans.length?`<div class="totals">
    <div class="big"><span>Restant</span><b>${eur(tLeft)}</b></div>
    <div><span>Par mois</span><b>${eur(tMonthly)}</b></div></div>`:'';
}

function openForm(l){
  editId=l?l.id:null;
  $('f-name').value=l?l.name:''; $('f-total').value=l?l.total:'';
  $('f-monthly').value=l?l.monthly:''; $('f-left').value=l?l.left:''; $('f-day').value=l&&l.day?l.day:'';
  $('save').textContent=l?'Enregistrer':'Ajouter';
  $('err').hidden=true; $('form').hidden=false; $('f-name').focus();
}
$('addBtn').onclick=()=>openForm(null);
$('cancel').onclick=()=>{$('form').hidden=true};
$('f-total').addEventListener('input',()=>{if(editId===null&&$('f-left').value==='')$('f-left').placeholder=$('f-total').value});
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('f-name').value.trim(), total=+$('f-total').value, monthly=+$('f-monthly').value;
  let left=$('f-left').value===''?total:+$('f-left').value;
  if(left>total){$('err').textContent='Le montant restant ne peut pas dépasser le montant total.';$('err').hidden=false;return}
  const dv=$('f-day').value, day=dv===''?null:Math.min(31,Math.max(1,Math.round(+dv)));
  // Le restant saisi est la valeur d'aujourd'hui : on repart de cette date pour les prochaines déductions
  const lastCheck=isoDay(today());
  if(editId!==null){Object.assign(loans.find(l=>l.id===editId),{name,total,monthly,left,day,lastCheck})}
  else loans.push({id:Date.now(),name,total,monthly,left,day,lastCheck});
  save(); $('form').hidden=true; render();
});
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.toggle){const l=loans.find(x=>x.id==b.dataset.toggle); l.closed=!l.closed; save(); render(); return}
  if(b.dataset.pay){const l=loans.find(x=>x.id==b.dataset.pay); l.left=Math.max(0,+(l.left-l.monthly).toFixed(2))}
  if(b.dataset.edit){openForm(loans.find(x=>x.id==b.dataset.edit));return}
  if(b.dataset.del){
    if(b.dataset.confirm){loans=loans.filter(x=>x.id!=b.dataset.del)}
    else{b.dataset.confirm=1;b.textContent='Confirmer ?';return}
  }
  save(); render();
});
render();
sync();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
setInterval(sync,60*60*1000);
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
